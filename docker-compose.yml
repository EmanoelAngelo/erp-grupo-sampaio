# Grupo Sampaio ERP — PRODUÇÃO em container.
#
#   docker compose up -d --build                      # a API, servindo as telas
#   docker compose --profile https up -d --build      # com o Caddy na frente (HTTPS)
#
# NADA AQUI É SEGREDO. Os valores obrigatórios vêm do ambiente do host — do
# shell ou do arquivo `.env` ao lado deste (o compose o lê para interpolar) — e
# o compose se recusa a subir sem eles, dizendo qual falta. Gere as chaves na
# própria máquina (ver .env.production.example); nunca as escreva aqui.
#
# PRODUÇÃO PELOS DOIS NOMES (GAP-PRD-151): este arquivo publicava com
# `DEVORA_API_ENV: development` e só o NODE_ENV do Dockerfile segurava as
# travas. Agora declara produção. Entrada sem senha não existe: não há linha
# para escrever como desligada.
#
# DADO EM VOLUME NOMEADO (GAP-PRD-062): banco + fotos em `devora-dados`,
# backup em `devora-backups`. Nunca monte a pasta `server/data` de uma
# instalação existente: ali mora o banco da loja, e o boot migraria ele.

services:
  api:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/}
    restart: unless-stopped
    # Só a própria máquina alcança a porta: quem fala com o mundo é o proxy.
    ports:
      - '127.0.0.1:${DEVORA_API_PORT_HOST:-8787}:8787'
    environment:
      DEVORA_API_ENV: production
      DEVORA_JWT_SECRET: ${DEVORA_JWT_SECRET:?defina DEVORA_JWT_SECRET no ambiente do host - ver .env.production.example}
      DEVORA_ENCRYPTION_KEY: ${DEVORA_ENCRYPTION_KEY:?defina DEVORA_ENCRYPTION_KEY no ambiente do host - ver .env.production.example}
      # A senha do administrador inicial (login admin, provisória) — só para a
      # PRIMEIRA subida. Depois da troca no primeiro acesso, apague-a do host e
      # suba de novo. Sem ela e sem administrador, a API sobe e avisa no log.
      DEVORA_BOOTSTRAP_ADMIN_PASSWORD: ${DEVORA_BOOTSTRAP_ADMIN_PASSWORD:-}
      DEVORA_FRONTEND_ORIGIN: ${DEVORA_FRONTEND_ORIGIN:?defina DEVORA_FRONTEND_ORIGIN com o endereco https do sistema}
      DEVORA_TRUST_PROXY: ${DEVORA_TRUST_PROXY:-1}
      GRUPO_SAMPAIO_PUBLIC_URL: ${GRUPO_SAMPAIO_PUBLIC_URL:-}
      DEVORA_SUPABASE_URL: ${DEVORA_SUPABASE_URL:-}
      DEVORA_SUPABASE_SERVICE_KEY: ${DEVORA_SUPABASE_SERVICE_KEY:-}
      DEVORA_SUPABASE_BUCKET: ${DEVORA_SUPABASE_BUCKET:-backups}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-465}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEVORA_DATABASE_PATH: /app/server/data/grupo-sampaio.db
      DEVORA_UPLOADS_DIR: /app/server/data/uploads
      DEVORA_BACKUP_DIR: /app/backups
    volumes:
      - devora-dados:/app/server/data
      - devora-backups:/app/backups
    # O desligamento da API tem prazo próprio de 8 s (GAP-PRD-063); a folga
    # aqui evita que o Docker a mate no meio dele.
    stop_grace_period: 15s

  # HTTPS com certificado automático (GAP-PRD-013). Precisa de um domínio
  # apontando para esta máquina e das portas 80 e 443 livres.
  proxy:
    image: caddy:2.8-alpine
    profiles:
      - https
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '80:80'
      - '443:443'
    environment:
      DEVORA_DOMINIO: ${DEVORA_DOMINIO:-erp.seudominio.com.br}
    volumes:
      - ./deploy/caddy/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy-dados:/data
      - caddy-config:/config

volumes:
  devora-dados:
  devora-backups:
  caddy-dados:
  caddy-config:
